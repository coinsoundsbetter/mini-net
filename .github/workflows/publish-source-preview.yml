name: Remove MiniNet source preview package
on:
  push:
    branches: [codex/publish-source-preview-0.1]
permissions:
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete the preview package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api=/users/coinsoundsbetter/packages/npm/mini-net
          gh api "$api" | jq -e '.name == "mini-net" and .repository.full_name == "coinsoundsbetter/mini-net"'
          gh api "$api/versions" | jq -e 'length == 1 and .[0].name == "0.1.0-preview.1"'
          gh api --method DELETE "$api"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com$api")
          test "$status" = 404
